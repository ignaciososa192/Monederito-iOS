name: iOS
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-build-and-test:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build and test without private service configuration
        run: |
          status=0
          bash Scripts/ci-ios.sh > .ci-build.log 2>&1 || status=$?
          tail -n 120 .ci-build.log
          exit "$status"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          include-hidden-files: true
          path: |
            .ci/MockTests.xcresult
            .ci-build.log
          if-no-files-found: ignore
